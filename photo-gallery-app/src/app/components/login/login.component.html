<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon class="app-icon">photo_library</mat-icon>
        Photo Gallery
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="welcome-text">Welcome to your personal photo gallery</p>
      <p class="description">Store, organize, and access your photos anytime, anywhere</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="login()" class="login-button">
        <mat-icon>login</mat-icon>
        Sign in with Microsoft
      </button>
    </mat-card-actions>
  </mat-card>
</div>
